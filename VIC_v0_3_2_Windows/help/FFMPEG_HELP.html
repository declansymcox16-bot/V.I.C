<h1>FFmpeg</h1><p>Run <code>INSTALL_FFMPEG.bat</code>. It uses WinGet to install Gyan.FFmpeg. Close old command windows afterwards and run <code>CHECK_SYSTEM.bat</code>.</p>
<p>VIC searches PATH, its own <code>tools\ffmpeg\bin</code> folder and common WinGet package locations.</p>
