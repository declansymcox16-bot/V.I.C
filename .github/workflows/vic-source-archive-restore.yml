name: Restore VIC Source Archive

on:
  push:
    paths:
      - '.vic-restore2/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .vic-restore2/part-*.b64 | base64 --decode > /tmp/vic-source.tar.xz
          echo "edfff239dc6b2973f6cdd38f3a953740931f1246bc99a85a7c577933aa23054f  /tmp/vic-source.tar.xz" | sha256sum -c -

      - name: Replace broken version folders
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -type d -name 'VIC_v*' -exec rm -rf {} +
          tar -xJf /tmp/vic-source.tar.xz -C .
          test "$(find . -mindepth 1 -maxdepth 1 -type d -name 'VIC_v*' | wc -l)" -eq 45
          rm -f SOURCE_ARCHIVE_README.md

      - name: Build Windows process-audio helper
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Compile process-audio helper for versions that use it
        shell: bash
        run: |
          set -euo pipefail
          for dir in             VIC_v0_8_5_Windows_EXPERIMENTAL_MULTI_APP_PROCESS_AUDIO             VIC_v0_8_6_Windows_EXPERIMENTAL_WINDOWS10_PROCESS_AUDIO             VIC_v0_8_7_Windows_EXPERIMENTAL_EMBEDDED_AUDIO_MODES             VIC_v0_9_0_Windows_EXPERIMENTAL_DISTRIBUTED_LIVE_PROCESSING
          do
            test -f "$dir/tools/vic_process_audio.go"
            (
              cd "$dir/tools"
              GOOS=windows GOARCH=amd64 CGO_ENABLED=0                 go build -trimpath -ldflags="-s -w"                 -o vic_process_audio.exe vic_process_audio.go
            )
            test -s "$dir/tools/vic_process_audio.exe"
          done

      - name: Safety checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.json' -n '"cluster_token"' VIC_v*              | grep -v 'CHANGE_ME_GENERATE_A_NEW_TOKEN'              | grep -v '"cluster_token": ""'
          then
            echo "Unexpected non-placeholder cluster token found."
            exit 1
          fi
          find VIC_v* -type d -name __pycache__ -prune -exec rm -rf {} +
          find VIC_v* -type f \( -name '*.pyc' -o -name '*.log' \) -delete

      - name: Remove temporary restore files
        shell: bash
        run: |
          rm -rf .vic-upload .vic_archive .vic-restore2
          rm -f .github/workflows/vic-source-archive-restore.yml

      - name: Commit restored VIC history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete VIC source history v0.1-v0.9.0"
          git push
